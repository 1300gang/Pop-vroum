<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pop Vroum — Partie</title>
  <style>
    /* Page de jeu d'atelier : le moins d'interface possible. Tout ce qui est
       réglage, mesure ou debug vit dans test-v5.html, jamais ici. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    #jeu {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    /* ---- Jauge de cohésion (haut, centre) ---- */
    #hud-cohesion {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
    }
    #cohesion-wrap {
      width: 160px;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      overflow: hidden;
    }
    #cohesion-bar {
      height: 100%;
      width: 0%;
      background: #ff6b6b;
      border-radius: 5px;
      transition: width 0.2s, background 0.3s;
    }
    #cohesion-bar.pleine { background: #66ff99; }

    /* ---- Annonces (attente, décompte, « Partez ! ») ---- */
    #annonce {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      display: none;
    }
    #annonce.petite { font-size: 26px; font-weight: 600; }

    /* ---- Bandeau « tu es arrivé·e » ---- */
    #bandeau-arrivee {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      background: rgba(255, 209, 102, 0.95);
      color: #222;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
      display: none;
    }

    /* ---- Frein / Reculer (tactile) ---- */
    #ctrl-boutons {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 17px;
      font-family: inherit;
      font-weight: 600;
      padding: 12px 26px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .ctrl-btn:active,
    .ctrl-btn.actif {
      background: rgba(255, 255, 255, 0.32);
      border-color: rgba(255, 255, 255, 0.7);
    }

    /* ---- Quitter (discret, pour l'animateur·trice) ---- */
    #btn-quitter {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      padding: 6px 10px;
      cursor: pointer;
    }

    /* ---- Fenêtres (quitter, victoire, chargement) ---- */
    .voile {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 25, 0.72);
      z-index: 10;
    }
    .voile.visible { display: flex; }
    .fenetre {
      background: #25253d;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 28px 32px;
      text-align: center;
      max-width: 90vw;
    }
    .fenetre h1 { font-size: 34px; margin-bottom: 8px; }
    .fenetre p  { font-size: 16px; opacity: 0.85; margin-bottom: 20px; }
    .fenetre .actions { display: flex; gap: 12px; justify-content: center; }
    .gros-btn {
      background: #5b6cff;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 12px 28px;
      cursor: pointer;
    }
    .gros-btn.secondaire { background: rgba(255, 255, 255, 0.14); }
    .gros-btn:disabled { opacity: 0.5; cursor: default; }
    #votes { margin-top: 12px; font-size: 14px; opacity: 0.75; min-height: 1em; }

    #loading-bar-wrap {
      width: 220px;
      height: 6px;
      margin: 14px auto 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    #loading-bar { height: 100%; width: 0%; background: #5b6cff; transition: width 0.2s; }
    #loading-msg { font-size: 13px; opacity: 0.75; }
  </style>
</head>
<body>
  <canvas id="jeu"></canvas>

  <div id="hud-cohesion">
    <span>Ensemble</span>
    <div id="cohesion-wrap"><div id="cohesion-bar"></div></div>
  </div>

  <div id="annonce"></div>
  <div id="bandeau-arrivee">Tu es arrivé·e ! On attend les autres…</div>

  <div id="ctrl-boutons">
    <button class="ctrl-btn" id="btn-ctrl-frein">Frein</button>
    <button class="ctrl-btn" id="btn-ctrl-reculer">Reculer</button>
  </div>

  <button id="btn-quitter">× Quitter</button>

  <div class="voile" id="modale-quitter">
    <div class="fenetre">
      <h1>Quitter la partie ?</h1>
      <p>Les autres continueront sans toi.</p>
      <div class="actions">
        <button class="gros-btn secondaire" id="btn-annuler-quitter">Rester</button>
        <button class="gros-btn" id="btn-confirmer-quitter">Quitter</button>
      </div>
    </div>
  </div>

  <div class="voile" id="ecran-victoire">
    <div class="fenetre">
      <h1>Vous êtes tous arrivés !</h1>
      <p>Bravo à toute l'équipe.</p>
      <div class="actions">
        <button class="gros-btn" id="btn-rejouer">Rejouer</button>
      </div>
      <div id="votes"></div>
    </div>
  </div>

  <div class="voile visible" id="loading">
    <div class="fenetre">
      <div>Connexion à la partie…</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
      <div id="loading-msg"></div>
    </div>
  </div>

  <script type="module" src="js/pages/game-page.js"></script>
</body>
</html>
