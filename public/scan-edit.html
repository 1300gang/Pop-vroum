<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pop Vroum — Retouche véhicule</title>
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ---- En-tête ---- */
    #entete {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    #entete h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ffd166;
    }

    #entete-pseudo {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      font-style: italic;
    }

    #badge-modifie {
      background: #e67e22;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 99px;
      display: none;
      margin-left: auto;
    }

    #badge-modifie.visible { display: inline-block; }

    #lien-retour {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    #lien-retour:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* ---- Barre palette (outil actif) ---- */
    #barre-palette {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #13132a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #barre-palette.visible { display: flex; }

    #palette-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-right: 4px;
      white-space: nowrap;
    }

    .outil-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.12s, box-shadow 0.12s;
      position: relative;
      flex-shrink: 0;
    }

    .outil-btn:hover {
      transform: scale(1.1);
    }

    .outil-btn.actif {
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25);
      transform: scale(1.08);
    }

    /* Touche raccourci en surimpression */
    .outil-btn .raccourci {
      position: absolute;
      bottom: -1px;
      right: -1px;
      background: rgba(0, 0, 0, 0.7);
      color: rgba(255, 255, 255, 0.7);
      font-size: 8px;
      font-weight: 700;
      width: 13px;
      height: 13px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #outil-gomme {
      background: rgba(255, 255, 255, 0.07);
      border: 3px solid transparent;
      color: rgba(255, 255, 255, 0.55);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #outil-gomme.actif {
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
    }

    #palette-hint {
      margin-left: auto;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.25);
      white-space: nowrap;
    }

    /* ---- État vide ---- */
    #etat-vide {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 20px;
      text-align: center;
    }

    #etat-vide.visible { display: flex; }

    #etat-vide .icone { font-size: 52px; opacity: 0.35; }

    #etat-vide h2 {
      font-size: 20px;
      font-weight: 700;
      color: #ffd166;
    }

    #etat-vide p {
      max-width: 340px;
      opacity: 0.5;
      line-height: 1.6;
    }

    #btn-aller-scanner {
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    #btn-aller-scanner:hover { background: #5568d3; }

    /* ---- Zone principale ---- */
    #zone-principale {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #zone-principale.visible { display: flex; }

    /* ---- Corps éditeur ---- */
    #corps-editeur {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ---- Panneau vues 2D ---- */
    #panneau-vues {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 12px;
      align-content: start;
    }

    .vue-tranche {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      /* Évite le reflow au survol des cellules */
      contain: layout;
    }

    .vue-tranche-titre {
      font-size: 11px;
      font-weight: 600;
      color: #a8e6cf;
      display: flex;
      align-items: center;
      gap: 5px;
      user-select: none;
    }

    .vue-index {
      width: 16px;
      height: 16px;
      background: rgba(168, 230, 207, 0.15);
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* Grille voxels 8×4 — touch-friendly */
    .grille-voxels {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .cellule-voxel {
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: crosshair;
      transition: filter 0.08s;
      position: relative;
      /* Taille minimum confortable pour le toucher */
      min-width: 20px;
      min-height: 20px;
    }

    .cellule-voxel.vide {
      background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.10);
    }

    /* Survol : montre l'outil actif en aperçu */
    .cellule-voxel:hover {
      filter: brightness(1.35);
    }

    /* Cellule actuellement survolée pendant le glisser */
    .cellule-voxel.survol-peindre {
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.6);
    }

    /* ---- Séparateur ---- */
    #separateur {
      width: 1px;
      background: rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }

    /* ---- Panneau 3D ---- */
    #panneau-3d {
      width: 260px;
      flex-shrink: 0;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #panneau-3d-titre {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #apercu-3d-wrap {
      background: #0f0f1e;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      overflow: hidden;
    }

    #canvas-apercu-3d {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
    }

    #apercu-hint {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      text-align: center;
    }

    /* ---- Barre d'actions ---- */
    #barre-actions {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }

    #barre-actions.visible { display: flex; }

    #msg-validation {
      flex: 1;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }

    #btn-annuler {
      background: rgba(255, 255, 255, 0.07);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #btn-annuler:hover { background: rgba(255, 255, 255, 0.13); }

    #btn-valider {
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    #btn-valider:hover  { background: #219a52; }
    #btn-valider:active { background: #1a7a40; }

    /* ---- Responsive tablette portrait (≤ 700px) ---- */
    @media (max-width: 700px) {
      #separateur, #panneau-3d { display: none; }

      #panneau-vues {
        grid-template-columns: 1fr 1fr;
        padding: 10px;
      }

      #palette-hint { display: none; }
    }

    /* ---- Responsive petit mobile (≤ 480px) ---- */
    @media (max-width: 480px) {
      #panneau-vues {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- En-tête -->
  <header id="entete">
    <h1>Retouche véhicule</h1>
    <span id="entete-pseudo"></span>
    <span id="badge-modifie">Modifié</span>
    <a id="lien-retour" href="scan2.html">↩ Scanner</a>
  </header>

  <!-- Barre palette (visible quand véhicule chargé) -->
  <div id="barre-palette" role="toolbar" aria-label="Outil de peinture">
    <span id="palette-label">Outil</span>
    <!-- Couleurs injectées par scan-edit.js -->
    <button id="outil-gomme" class="outil-btn actif" title="Gomme (0)">
      ✕
      <span class="raccourci">0</span>
    </button>
    <span id="palette-hint">Cliquer ou glisser pour peindre</span>
  </div>

  <!-- État vide -->
  <div id="etat-vide">
    <div class="icone">🚗</div>
    <h2>Aucun véhicule scanné</h2>
    <p>Scannez d'abord votre feuille de véhicule pour pouvoir le retoucher ici.</p>
    <button id="btn-aller-scanner">Aller scanner</button>
  </div>

  <!-- Zone principale -->
  <div id="zone-principale">

    <div id="corps-editeur">

      <!-- 4 vues 2D en 2×2 -->
      <div id="panneau-vues">
        <!-- Injecté par scan-edit.js -->
      </div>

      <div id="separateur"></div>

      <!-- Aperçu 3D -->
      <div id="panneau-3d">
        <div id="panneau-3d-titre">Aperçu 3D</div>
        <div id="apercu-3d-wrap">
          <canvas id="canvas-apercu-3d"></canvas>
        </div>
        <div id="apercu-hint">Glisser pour orbiter</div>
      </div>

    </div>

    <!-- Barre d'actions -->
    <div id="barre-actions" class="visible">
      <span id="msg-validation">Sélectionnez une couleur puis cliquez ou glissez sur les cellules.</span>
      <button id="btn-annuler">Annuler</button>
      <button id="btn-valider">Valider les retouches</button>
    </div>

  </div>

  <script type="module" src="/js/pages/scan-edit.js"></script>
</body>
</html>
